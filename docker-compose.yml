version: '3.8'

services:
  # 1. The Manager (Node.js)
  backend:
    build: ./Backend
    container_name: cluaiz-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/cluaiz
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chroma:8000
      - OLLAMA_URL=http://ollama:11434
      - AI_ENGINE_URL=http://ai_engine:5000
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_CHAT_MODEL=mistral:7b
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTO_PULL_MODELS=true
    depends_on:
      - redis
      - mongo
      - chroma
      - ollama
      - ai_engine

  # 2. The Brain (Python)
  ai_engine:
    build: ./ai_engine
    container_name: cluaiz-ai-engine
    restart: always
    ports:
      - "8001:5000" # Host 8001 -> Container 5000 (As requested)
    volumes:
      - ./ai_engine:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/cluaiz
      - OLLAMA_URL=http://ollama:11434
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

  # 3. The Face (Next.js)
  frontend:
    build: ./Frontend
    container_name: cluaiz-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000

  # --- Infrastructure ---

  mongo:
    image: mongo:6
    container_name: cluaiz-mongo
    restart: always
    ports: [ "27017:27017" ]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: cluaiz-redis
    restart: always
    ports: [ "6379:6379" ]

  chroma:
    image: chromadb/chroma:latest
    container_name: cluaiz-chroma
    restart: always
    ports: [ "8000:8000" ]

  ollama:
    image: ollama/ollama:latest
    container_name: cluaiz-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 10s
      timeout: 5s
      retries: 80

  # 4. Storage (MinIO - Self Hosted S3)
  minio:
    image: minio/minio
    container_name: cluaiz-storage
    restart: always
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123" # TODO: Change in Production
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mongo_data:
  ollama_data:
  minio_data:
