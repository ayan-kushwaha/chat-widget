name: cluaiz

services:
  # 1. The Manager (Node.js)
  backend:
    build: ./Backend
    image: cluaiz/backend
    container_name: cluaiz-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/cluaiz
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333 # PILLAR C
      - OLLAMA_URL=http://ollama:11434
      - VOICE_SERVICE_URL=http://voice-service:8080 # PILLAR F
      - AI_ENGINE_URL=http://ai_engine:5000
      - OLLAMA_EMBED_MODEL=bge-m3:latest
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTO_PULL_MODELS=true
    depends_on:
      - redis
      - mongo
      - qdrant
      - ollama
      - ai_engine

  # 2. The Brain (Python)
  ai_engine:
    build: ./ai_engine
    image: cluaiz/ai-engine
    container_name: cluaiz-ai-engine
    restart: always
    ports:
      - "8001:5000"
    volumes:
      - ./ai_engine:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/cluaiz
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cluaiz_neural_os
      - SEARXNG_URL=http://searxng:8080
    command: uvicorn main:app --host 0.0.0.0 --port 5000 --reload

  # 3. The Face (Next.js)
  frontend:
    build: ./Frontend
    image: cluaiz/frontend
    container_name: cluaiz-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000

  # 5. Neural Graph Database (Neo4j)
  neo4j:
    image: neo4j:5-community
    container_name: cluaiz-neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/cluaiz_neural_os
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "cluaiz_neural_os", "RETURN 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cluaiz-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  voice-service:
    build: ./voice-service
    image: cluaiz/voice-service
    container_name: cluaiz-voice
    restart: always
    ports:
      - "8080:8080"
    environment:
      - STT_MODEL=turbo
      - WHISPER_DEVICE=cpu
    volumes:
      - voice_models:/app/models

  mongo:
    image: mongo:6
    container_name: cluaiz-mongo
    restart: always
    ports: [ "27017:27017" ]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: cluaiz-redis
    restart: always
    ports: [ "6379:6379" ]

  ollama:
    image: ollama/ollama:latest
    container_name: cluaiz-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 80

  ollama-puller:
    image: ollama/ollama:latest
    container_name: cluaiz-model-puller
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "sleep 5 && ollama pull bge-m3:latest && echo '✅ BGE-M3 model pulled! Memory ready!'" ]

  minio:
    image: minio/minio
    container_name: cluaiz-storage
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password123"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: cluaiz-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "localhost:8123/ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  celery-worker:
    build: ./ai_engine
    image: cluaiz/ai-engine
    container_name: cluaiz-celery-worker
    restart: always
    command: celery -A src.core.celery_app worker --loglevel=info --queues=default,neural,high_pri
    environment:
      - REDIS_URL=redis://redis:6379/1
      - MONGO_URI=mongodb://mongo:27017/cluaiz
      - OLLAMA_URL=http://ollama:11434
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - redis
      - mongo
      - ai_engine

  celery-beat:
    build: ./ai_engine
    image: cluaiz/ai-engine
    container_name: cluaiz-celery-beat
    restart: always
    command: celery -A src.core.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
      - celery-worker

  searxng:
    container_name: cluaiz-searxng
    image: searxng/searxng:latest
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  #  voice-model:
  #    image: cluaiz-voice-engine
  #    container_name: cluaiz-voice-engine
  #    ports:
  #      - "8001:8001"

  # 🧠 Atma — BitNet-b1.58-2B-4T (Sovereign 1.58-bit Local Intelligence)
  bitnet-atma:
    build:
      context: ./bitnet-service
      dockerfile: Dockerfile
    image: cluaiz/bitnet-atma
    container_name: cluaiz-atma
    ports:
      - "8081:8081"
    volumes:
      # Model stored in Cluaiz-OS (sovereign, outside Docker)
      - ../Cluaiz-OS/Cluaiz-ai/models/bitnet-personalized-llm:/models
    environment:
      - BITNET_PORT=8081
      - BITNET_THREADS=4
      - BITNET_CTX_SIZE=2048
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🚀 Turbo LLM Engine (LMDeploy Rocket Mode)
  turbo-engine:
    build:
      context: ./turbo_LLM_engine
      dockerfile: Dockerfile.turbo
    # image: cluaiz-turbo-engine:hotpatch
    container_name: cluaiz-turbo-engine
    ports:
      - "8085:8000"
    volumes:
      - ./AI_Models:/app/models
      - ./turbo_LLM_engine:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - MODEL_PATH=/app/models/Qwen3-4B-AWQ
    restart: unless-stopped

volumes:
  mongo_data:
  ollama_data:
  minio_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  voice_models:
  searxng_data:
  clickhouse_data:
  ai_models:
  turbo_engine:
