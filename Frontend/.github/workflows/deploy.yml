name: Deploy Frontend Only

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cluaiz-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.cluaiz.com/v1
            NEXT_PUBLIC_APP_URL=https://app.cluaiz.com

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/cluaiz
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            
            # Pull Only Frontend
            docker compose pull frontend
            
            # Restart Only Frontend (Zero Downtime for others)
            docker compose up -d --no-deps frontend
            
            docker image prune -f
